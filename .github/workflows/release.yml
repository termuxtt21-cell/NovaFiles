name: Build NovaFiles APK

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build NovaFiles APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle 9.6.0
        run: |
          curl -L \
            -o gradle-9.6.0-bin.zip \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip

          unzip -q gradle-9.6.0-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-9.6.0/bin" \
            >> "$GITHUB_PATH"

      - name: Check environment
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Build release APK
        run: |
          gradle assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/release/app-release.apk \
            output/NovaFiles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaFiles-APK
          path: output/NovaFiles.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/NovaFiles.apk
          generate_release_notes: true
